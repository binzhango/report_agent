name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
      XDG_CACHE_HOME: ${{ runner.temp }}/report-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install LibreOffice and fonts
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libreoffice-writer libreoffice-calc libreoffice-impress \
            fonts-dejavu-core fonts-liberation poppler-utils
      - name: Install Python dependencies
        run: uv sync --locked --extra parquet
      - name: Record export engine and dependency versions
        run: |
          mkdir -p ci-results
          soffice --version | tee ci-results/libreoffice-version.txt
          dpkg-query -W libreoffice-core libreoffice-writer libreoffice-calc libreoffice-impress fonts-dejavu-core fonts-liberation > ci-results/system-packages.txt
          uv --version > ci-results/uv-version.txt
          uv run --no-sync python --version > ci-results/python-version.txt
          cat ci-results/libreoffice-version.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Lint and format
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Run tests including real Office exports
        run: uv run --no-sync pytest -q -ra --junitxml=ci-results/tests.xml
      - name: Build distribution
        run: uv build
      - name: Retain test results and exact engine versions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-and-engine-versions
          path: ci-results/
          if-no-files-found: warn
