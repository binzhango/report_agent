[project]
name = "report-agent"
version = "0.1.0"
description = "Render LaTeX templates into PDF reports with metadata and runtime content."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "typer>=0.29.0",
]

[project.scripts]
report = "report_agent.interfaces.cli.app:app"

[project.optional-dependencies]
parquet = [
    "pyarrow>=26.0.1",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
